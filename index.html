<!doctype html>
<html lang="es-UY" data-page="inicio">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Decora.te · Accesorios de cuero hechos a mano</title>
  <meta name="description" content="Cintos y accesorios de cuero hechos a mano en Uruguay. Piezas únicas en stock y a medida: armá la tuya en 3D con el cuero real.">
  <meta name="theme-color" content="#1c1410">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c1410'/%3E%3Cpath d='M16 25s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 24 14c0 6-8 11-8 11z' fill='%23efe7da'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Decora.te">
  <meta property="og:title" content="Decora.te · Accesorios de cuero hechos a mano">
  <meta property="og:description" content="Cintos y accesorios de cuero hechos a mano en Uruguay. Piezas únicas en stock y a medida: armá la tuya en 3D con el cuero real.">
  <meta property="og:url" content="https://juliagomez2401.github.io/Decorate/">
  <meta property="og:image" content="https://juliagomez2401.github.io/Decorate/img/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="img/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=33">
  <script src="js/arranque.js"></script>
</head>
<body>

  <main>

    <!-- ============ INICIO ============ -->
    <section class="hero hero--single" aria-label="Inicio" data-page-hero>
      <div class="hero__photo">
        <picture>
          <!-- en pantallas paradas (celular, tablet vertical) va una foto vertical -->
          <source media="(max-aspect-ratio: 1/1)" srcset="img/inicio-movil-sm.jpg 900w, img/inicio-movil.jpg 1500w" sizes="100vw">
          <img data-page-hero-img src="img/inicio-sm.jpg" srcset="img/inicio-sm.jpg 1300w, img/inicio.jpg 2600w" sizes="100vw" alt="Cintos de cuero hechos a mano por Decora.te" fetchpriority="high">
        </picture>
      </div>
      <div class="hero__shade" aria-hidden="true"></div>
      <div class="hero__content">
        <p class="hero__kicker" data-fade>Hecho a mano, <em>hecho para vos.</em></p>
        <a class="btn btn--cream" href="tienda.html" data-fade>Ver la tienda</a>
      </div>
    </section>

    <!-- ============ PIEZAS EN STOCK ============ -->
    <section class="stockrow" aria-labelledby="stock-title">
      <div class="wrap">
        <div class="stockrow__head">
          <h2 id="stock-title" data-fade>Piezas únicas en stock</h2>
          <a class="link" href="tienda.html" data-fade>Ver todas</a>
        </div>
      </div>
      <div class="wrap"><div class="stockrow__grid" data-stock-row></div></div>
    </section>

    <!-- ============ ARMÁ EL TUYO ============ -->
    <section class="mto" aria-labelledby="mto-title">
      <div class="mto__bg" data-parallax="10"><img src="img/fondo-cuero.jpg" alt="" loading="lazy"></div>
      <div class="wrap mto__in">
        <div class="mto__head">
          <p class="mto__kicker" data-fade>A medida</p>
          <h2 id="mto-title" class="mto__title" data-fade>Armá el tuyo</h2>
          <p class="mto__txt" data-fade>Todas nuestras piezas se pueden hacer a medida. Elegís cuál, el cuero y los detalles, y la hacemos a mano. Pedidos con 72 horas de anticipación.</p>
        </div>
        <div class="mto__grid" data-mto-grid></div>
      </div>
    </section>

  </main>

  <script src="js/datos.js?v=33"></script>
  <script src="js/stock.js?v=32"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="js/sitio.js?v=34" defer></script>
  <script src="js/tienda.js?v=34" defer></script>
</body>
</html>
