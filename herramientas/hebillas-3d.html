<!doctype html><html><head><meta charset="utf-8"><base href="../"><title>Hebillas 3D</title>
<style>body{background:#efe7da;margin:0;padding:8px;font:13px sans-serif}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.c{display:grid;grid-template-columns:1fr 1fr;background:#f7f2ea}.c img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.c p{grid-column:1/3;margin:2px 4px}#h{position:fixed;left:-2000px;width:420px;height:420px}</style></head>
<body><div class="g" id="g"></div><div id="h"></div>
<script src="js/datos.js?v=99"></script><script src="js/hebillas-formas.js?v=6"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/pieza3d.js?v=55"></script>
<script>
(async()=>{const g=document.getElementById('g'), q=new URLSearchParams(location.search), solo=q.get('h');
const v=DT3D.create(document.getElementById('h'));for(const h of window.DT.hebillas){v.update('hebilla',{hebilla:h.id});}await new Promise(r=>setTimeout(r,2500));
for(const h of window.DT.hebillas.filter(h=>!solo||h.id===solo)){v.update('hebilla',{hebilla:h.id});await new Promise(r=>setTimeout(r,400));const s=v.snapshot(420);
const c=document.createElement('div');c.className='c';c.innerHTML=`<img src="img/hebilla-${h.id}.png"><img src="${s}"><p>${h.id}</p>`;g.appendChild(c);}
document.title='listo';})();
</script></body></html>
